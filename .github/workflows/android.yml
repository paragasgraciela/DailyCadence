
name: Build DailyCadence APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DailyCadence_2.0_Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q DailyCadence_2.0_Source.zip -d .

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("DailyFlowAndroid/app/build.gradle.kts")
          s = p.read_text()

          marker = "    buildFeatures { compose = true }"

          replacement = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures { compose = true }"""

          if marker not in s:
              raise SystemExit("Could not find buildFeatures marker")

          p.write_text(s.replace(marker, replacement, 1))
          print("Java and Kotlin targets aligned to Java 17.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p DailyFlowAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyCadence-APK
          path: DailyFlowAndroid/app/build/outputs/apk/debug/app-debug.apk
          
          
